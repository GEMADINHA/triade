<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tríade · anotações</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231b2a4e%22/><path d=%22M50 18 86 80H14z%22 fill=%22%23d4202c%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ferrete:#1b2a4e; --ferrete2:#4a6fa5; --red:#d4202c; --white:#fff;
  --tint:#eef1f8; --line:#d5dbea; --soft:#5d6a8c; --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--tint);color:var(--ferrete);font:16px/1.5 Figtree,system-ui,sans-serif;min-height:100vh}
header{background:var(--ferrete);color:#fff;border-bottom:6px solid var(--red)}
.in{max-width:780px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:12px;padding:22px 0 14px}
.brand svg{width:38px;height:38px;flex:none}
h1{font:800 2.2rem/1 'Bricolage Grotesque',sans-serif;margin:0;letter-spacing:-.02em}
h1 small{font:500 1rem Figtree,sans-serif;opacity:.75;margin-left:8px;letter-spacing:0}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:4px;scrollbar-width:thin}
.tab{display:flex;align-items:center;flex:none;border-radius:12px 12px 0 0;color:#cfd7ee}
.tab button{background:none;border:0;color:inherit;font:600 .95rem Figtree,sans-serif;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--tint);color:var(--ferrete)}
.tab .tx{display:none;padding:10px 12px 10px 0;color:var(--red);font-size:1.1rem;line-height:1}
.tab[aria-selected=true] .tx{display:block}
.newtab{align-self:center;margin-left:6px;border:1.5px dashed #8d9bc4!important;border-radius:999px!important;padding:5px 12px!important;font-size:.85rem!important;color:#cfd7ee!important}
main.in{padding-top:20px;padding-bottom:110px}
.banner{background:#fff;border-left:5px solid var(--red);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:.9rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1.5px solid var(--ferrete);background:#fff;color:var(--ferrete);font:inherit;font-size:.88rem;padding:4px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ferrete);color:#fff}
h2{font:800 1.05rem 'Bricolage Grotesque',sans-serif;margin:22px 0 10px}
.item{position:relative;display:flex;background:#fff;border:1px solid var(--line);border-left:7px solid var(--c);border-radius:var(--r);margin-bottom:10px}
.item .main{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;text-align:left;background:none;border:0;font:inherit;color:inherit;padding:12px 8px 12px 14px;cursor:pointer;border-radius:var(--r)}
.item .x{flex:none;background:none;border:0;color:var(--soft);font-size:1.3rem;padding:0 14px;cursor:pointer}
.item .x:hover{color:var(--red)}
.date{min-width:54px;text-align:center;line-height:1.1}
.date b{display:block;font:800 1.55rem 'Bricolage Grotesque',sans-serif}
.date span{font-size:.76rem;color:var(--soft)}
.body{flex:1;min-width:0}
.title{font-weight:600}
.meta{font-size:.85rem;color:var(--soft)}
.txt{white-space:pre-wrap;margin-top:4px;font-size:.93rem}
.tag{display:inline-block;font-size:.76rem;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--ferrete);color:#fff;margin-right:6px}
.tag.prova{background:var(--red)}
.when{font-size:.8rem;font-weight:600;white-space:nowrap;padding-top:2px}
.when.soon{color:var(--red)}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.sec summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none;font-weight:600}
.sec summary::-webkit-details-marker{display:none}
.sec .ic{font-size:1.5rem;width:38px;height:38px;display:grid;place-items:center;background:var(--tint);border-radius:10px}
.sec .n{margin-left:auto;font-size:.82rem;color:var(--soft);font-weight:500}
.plus{border:1.5px solid var(--red);color:var(--red);background:#fff;width:30px;height:30px;border-radius:50%;font-size:1.2rem;line-height:1;cursor:pointer}
.plus:hover{background:var(--red);color:#fff}
.sec .list{padding:0 12px 4px}
.sec .none{padding:0 14px 14px;color:var(--soft);font-size:.9rem}
.sec .item{box-shadow:none;background:var(--tint)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.notes .item{margin:0;border-left:1px solid var(--line);border-top:6px solid var(--c)}
.notes .main{display:block}
.notes .x{position:absolute;top:2px;right:0;padding:4px 10px}
.cal{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:6px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead button{border:0;background:var(--tint);color:var(--ferrete);width:34px;height:34px;border-radius:50%;font-size:1.3rem;line-height:1;cursor:pointer}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow span{font-size:.75rem;color:var(--soft);font-weight:600;padding-bottom:2px}
.day{min-height:46px;border:0;background:var(--tint);border-radius:10px;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.day b{font-weight:600;font-size:.9rem}
.day.today{outline:2px solid var(--ferrete)}
.day.sel{background:var(--ferrete);color:#fff}
.dots{display:flex;gap:3px;height:6px}
.dots i,.legend i{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--ferrete2)}
.dots i.prova,.legend i.prova{background:var(--red)}
.legend{font-size:.78rem;color:var(--soft);margin-top:10px;display:flex;gap:6px;align-items:center}
.legend i{width:9px;height:9px;margin-left:8px}
.clear{background:none;border:0;color:var(--red);font:600 .85rem Figtree,sans-serif;text-decoration:underline;cursor:pointer;margin-left:8px}
.empty{border:1.5px dashed var(--soft);border-radius:var(--r);padding:26px;text-align:center;color:var(--soft);background:rgba(255,255,255,.7)}
.fab{position:fixed;right:20px;bottom:20px;border:0;background:var(--red);color:#fff;font:700 1rem Figtree,sans-serif;padding:14px 24px;border-radius:999px;cursor:pointer;box-shadow:0 6px 18px rgba(27,42,78,.35)}
.fab:active{transform:scale(.97)}
dialog{border:0;border-radius:18px;padding:22px;width:min(440px,92vw);color:var(--ferrete);box-shadow:0 20px 50px rgba(27,42,78,.4)}
dialog::backdrop{background:rgba(27,42,78,.55)}
dialog h3{font:800 1.3rem 'Bricolage Grotesque',sans-serif;margin:0 0 4px}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;color:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,textarea:focus{border-color:var(--ferrete)}
textarea{resize:vertical;min-height:80px}
.seg{display:flex;gap:6px}
.seg label{flex:1;margin:0}
.seg input{position:absolute;opacity:0;width:0}
.seg span{display:block;text-align:center;padding:8px 4px;border:1.5px solid var(--ferrete);border-radius:10px;cursor:pointer;font-weight:600}
.seg input:checked+span{background:var(--ferrete);color:#fff}
.seg input:focus-visible+span,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ferrete2);outline-offset:2px}
.actions{display:flex;gap:8px;margin-top:18px}
.btn{font:600 .95rem Figtree,sans-serif;padding:10px 16px;border-radius:10px;border:1.5px solid var(--ferrete);background:#fff;color:var(--ferrete);cursor:pointer}
.btn.main{background:var(--ferrete);color:#fff;margin-left:auto}
.btn.del{color:var(--red);border-color:var(--red)}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ferrete);color:#fff;padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="in">
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8 94 88H6z" fill="#d4202c"/><path d="M50 40 70 76H30z" fill="#fff"/></svg>
      <h1>Tríade<small>anotações</small></h1>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>

<main class="in">
  <div id="banner"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</main>
<button class="fab" id="add">+ Anotar</button>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h3 id="dlgTitle">Anotar</h3>
    <div class="seg" id="typeBox" role="radiogroup" aria-label="Tipo">
      <label><input type="radio" name="type" value="prova" checked><span>Prova</span></label>
      <label><input type="radio" name="type" value="trabalho"><span>Trabalho</span></label>
    </div>
    <div id="subjBox"><label for="subject">Matéria</label>
      <input id="subject" list="subjects" placeholder="Ex.: Física"><datalist id="subjects"></datalist></div>
    <label for="title" id="titleLabel">Título</label>
    <input id="title" required>
    <div id="dateBox"><label for="date">Data</label><input id="date" type="date"></div>
    <label for="notes" id="notesLabel">Observações (opcional)</label>
    <textarea id="notes"></textarea>
    <label for="author">Seu nome (opcional)</label>
    <input id="author" placeholder="Para a galera saber quem anotou">
    <div class="actions">
      <button type="button" class="btn del" id="del" hidden>Excluir</button>
      <button type="button" class="btn" id="cancel">Cancelar</button>
      <button type="submit" class="btn main">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="tdlg">
  <form id="tform" method="dialog">
    <h3>Nova aba</h3>
    <label for="tname">Nome da aba</label>
    <input id="tname" required placeholder="Ex.: Simulados">
    <label>O que vai nela?</label>
    <div class="seg" style="flex-direction:column">
      <label><input type="radio" name="kind" value="agenda" checked><span>📅 Provas e trabalhos (com data)</span></label>
      <label><input type="radio" name="kind" value="conteudo"><span>📚 Conteúdos por matéria</span></label>
      <label><input type="radio" name="kind" value="notas"><span>📝 Anotações livres</span></label>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="tcancel">Cancelar</button>
      <button type="submit" class="btn main">Criar aba</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

const FIREBASE_CONFIG = { apiKey:"AIzaSyC7zy6R99Z5UCii3PVdrdPpus-rQv0vDwM", authDomain:"triade-5270f.firebaseapp.com", projectId:"triade-5270f", appId:"1:295662896487:web:a624f95416062fc3bd5bc2" };

const $ = s => document.querySelector(s);
const SUBJ = [['Física','⚛️'],['Química','🧪'],['Biologia','🧬'],['Matemática','📐'],['Português','📖'],['Literatura','✒️'],['Redação','✍️'],['História','🏛️'],['Geografia','🌎'],['Inglês','🔤'],['Filosofia','🧠'],['Sociologia','👥'],['Artes','🎨'],['Educação Física','⚽']];
const KIND = {agenda:'📅', conteudo:'📚', notas:'📝'};
const SEED = [
  {id:'provas', name:'Provas e datas', kind:'agenda', order:1},
  {id:'conteudos', name:'Conteúdos do trimestre', kind:'conteudo', order:2},
  {id:'notas', name:'Anotações', kind:'notas', order:3}
];

/* ---------- armazenamento local seguro (nunca quebra se o navegador bloquear) ---------- */
const mem = {};
const ls = {
  get(k){ if (k in mem) return mem[k]; try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ mem[k] = v; try { localStorage.setItem(k,v); } catch {} }
};

let tabs = [], items = [], curId = '', filter = '', editing = null, db = null, seeded = false;
let calM = new Date(); calM.setDate(1); let selDay = '';

/* ---------- banco: Firebase (compartilhado) ou local ---------- */
const store = {
  start(cb){
    if (FIREBASE_CONFIG && window.firebase){
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      let T = [], I = [];
      const err = () => toast('Sem permissão ou sem conexão com o banco.');
      db.collection('abas').onSnapshot(s => {
        T = s.docs.map(d => ({id:d.id, ...d.data()}));
        if (!T.length && !seeded){ seeded = true; SEED.forEach(t => this.saveTab(t)); }
        cb(T, I);
      }, err);
      db.collection('itens').onSnapshot(s => { I = s.docs.map(d => ({id:d.id, ...d.data()})); cb(T, I); }, err);
    } else {
      $('#banner').innerHTML = '<div class="banner"><b>Modo local:</b> o que você anota fica só neste navegador. Conecte o Firebase para compartilhar com os amigos.</div>';
      let data; try { data = JSON.parse(ls.get('triade') || 'null'); } catch {}
      this.d = data || {tabs:SEED, items:[]};
      this.cb = cb; cb(this.d.tabs, this.d.items);
    }
  },
  persist(){ ls.set('triade', JSON.stringify(this.d)); this.cb(this.d.tabs, this.d.items); },
  put(col, key, obj){
    const {id, ...data} = obj;
    if (db) return id ? db.collection(col).doc(id).set(data) : db.collection(col).add(data);
    const arr = this.d[key], rec = {...data, id: id || Date.now().toString(36) + Math.random().toString(36).slice(2,5)};
    const i = arr.findIndex(x => x.id === rec.id);
    i >= 0 ? arr[i] = rec : arr.push(rec);
    this.persist(); return Promise.resolve(rec);
  },
  saveItem(it){ return this.put('itens','items',it); },
  saveTab(t){ return this.put('abas','tabs',t); },
  removeItem(id){
    if (db) return db.collection('itens').doc(id).delete();
    this.d.items = this.d.items.filter(x => x.id !== id); this.persist();
  },
  async removeTab(id){
    if (db){
      const b = db.batch();
      items.filter(i => i.tab === id).forEach(i => b.delete(db.collection('itens').doc(i.id)));
      b.delete(db.collection('abas').doc(id)); return b.commit();
    }
    this.d.items = this.d.items.filter(x => x.tab !== id);
    this.d.tabs = this.d.tabs.filter(x => x.id !== id); this.persist();
  }
};

/* ---------- utilidades ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function findSubj(n){
  const x = norm(n); if (!x) return null;
  return SUBJ.find(([s]) => { const y = norm(s); return y === x || (x.length >= 3 && y.startsWith(x)); }) || null;
}
const canon = n => (findSubj(n) || [n])[0];
const icon = n => (findSubj(n) || [0,'📚'])[1];
const toDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const todayStr = () => new Date().toLocaleDateString('sv');
function when(s){
  const n = Math.round((toDate(s) - today()) / 864e5);
  if (n === 0) return ['hoje', true]; if (n === 1) return ['amanhã', true];
  if (n > 1) return [`em ${n} dias`, n <= 7]; if (n === -1) return ['ontem', false];
  return [`há ${-n} dias`, false];
}
let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }
const curTab = () => tabs.find(t => t.id === curId);

/* ---------- renderização ---------- */
function card(it, kind){
  const x = `<button class="x" data-del="${esc(it.id)}" aria-label="Excluir" title="Excluir">×</button>`;
  if (kind === 'notas'){
    return `<div class="item" style="--c:var(--ferrete2)"><button class="main" data-id="${esc(it.id)}">
      <div class="title">${esc(it.title)}</div><div class="txt">${esc(it.notes)}</div>
      ${it.author ? `<div class="meta" style="margin-top:6px">por ${esc(it.author)}</div>` : ''}</button>${x}</div>`;
  }
  const d = toDate(it.date), [label, soon] = when(it.date), ag = kind === 'agenda';
  const color = it.type === 'prova' ? 'var(--red)' : it.type === 'trabalho' ? 'var(--ferrete2)' : 'var(--ferrete)';
  return `<div class="item" style="--c:${color}"><button class="main" data-id="${esc(it.id)}">
    <div class="date"><b>${d.getDate()}</b><span>${d.toLocaleDateString('pt-BR',{month:'short',weekday:'short'}).replace(/\./g,'')}</span></div>
    <div class="body"><div class="title">${esc(it.title)}</div>
      <div class="meta">${ag ? `<span class="tag ${it.type}">${it.type === 'prova' ? 'Prova' : 'Trabalho'}</span>${icon(it.subject)} ${esc(it.subject)}` : ''}${it.author ? (ag ? ' · ' : '') + 'por ' + esc(it.author) : ''}</div>
      ${it.notes ? `<div class="txt meta">${esc(it.notes)}</div>` : ''}</div>
    ${ag ? `<div class="when ${soon ? 'soon' : ''}">${label}</div>` : ''}</button>${x}</div>`;
}

function calendar(ev){
  const y = calM.getFullYear(), m = calM.getMonth();
  const first = new Date(y, m, 1).getDay(), n = new Date(y, m + 1, 0).getDate();
  const by = {}; ev.forEach(i => (by[i.date] = by[i.date] || []).push(i));
  const tod = todayStr();
  let cells = '<span></span>'.repeat(first);
  for (let d = 1; d <= n; d++){
    const s = `${y}-${String(m + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`, e = by[s] || [];
    const tip = e.map(i => `${i.subject}: ${i.title}`).join('\n');
    cells += `<button class="day${s === tod ? ' today' : ''}${s === selDay ? ' sel' : ''}" data-day="${s}" title="${esc(tip)}" aria-label="Dia ${d}${e.length ? ', ' + e.length + ' compromisso(s)' : ''}">
      <b>${d}</b><span class="dots">${e.slice(0,3).map(i => `<i class="${i.type}"></i>`).join('')}</span></button>`;
  }
  let title = calM.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  title = title.charAt(0).toUpperCase() + title.slice(1);
  return `<div class="cal"><div class="calhead"><button data-cal="-1" aria-label="Mês anterior">‹</button><strong>${esc(title)}</strong><button data-cal="1" aria-label="Próximo mês">›</button></div>
    <div class="dow">${['D','S','T','Q','Q','S','S'].map(x => `<span>${x}</span>`).join('')}</div>
    <div class="days">${cells}</div>
    <div class="legend"><i class="prova"></i>Prova <i></i>Trabalho</div></div>`;
}

function render(){
  if (!tabs.some(t => t.id === curId)) curId = [...tabs].sort((a,b) => a.order - b.order)[0]?.id || '';
  const sorted = [...tabs].sort((a,b) => a.order - b.order);
  $('#tabs').innerHTML = sorted.map(t => `<div class="tab" role="tab" aria-selected="${t.id === curId}">
    <button data-tab="${esc(t.id)}">${KIND[t.kind] || ''} ${esc(t.name)}</button>
    <button class="tx" data-rmtab="${esc(t.id)}" aria-label="Remover aba" title="Remover esta aba">×</button></div>`).join('')
    + `<button class="newtab" id="newtab">+ Nova aba</button>`;

  const tab = curTab(), box = $('#list'), chips = $('#chips');
  $('#add').hidden = !tab; chips.innerHTML = '';
  if (!tab){ box.innerHTML = `<div class="empty">Nenhuma aba por aqui. Toque em <b>+ Nova aba</b> para criar a primeira.</div>`; return; }

  const pool = items.filter(i => i.tab === tab.id);
  $('#subjects').innerHTML = [...new Set([...SUBJ.map(s => s[0]), ...pool.map(i => i.subject)])].filter(Boolean).map(s => `<option value="${esc(s)}">`).join('');

  if (tab.kind === 'agenda'){
    const subs = [...new Set(pool.map(i => i.subject))].sort();
    if (filter && !subs.includes(filter)) filter = '';
    if (subs.length) chips.innerHTML = ['', ...subs].map(s => `<button class="chip" data-s="${esc(s)}" aria-pressed="${s === filter}">${s ? icon(s) + ' ' + esc(s) : 'Todas'}</button>`).join('');
    const ev = pool.filter(i => !filter || i.subject === filter);
    const evAll = items.filter(i => (i.type === 'prova' || i.type === 'trabalho') && (!filter || i.subject === filter));
    const up = ev.filter(i => toDate(i.date) >= today()).sort((a,b) => a.date.localeCompare(b.date));
    const past = ev.filter(i => toDate(i.date) < today()).sort((a,b) => b.date.localeCompare(a.date));
    let list;
    if (selDay){
      const dd = evAll.filter(i => i.date === selDay);
      const fmt = toDate(selDay).toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
      list = `<h2>${esc(fmt)}<button class="clear" data-clear>ver tudo</button></h2>`
        + (dd.length ? dd.map(i => card(i,'agenda')).join('') : `<div class="empty">Nada marcado neste dia. Toque em <b>+ Anotar</b> para adicionar.</div>`);
    } else {
      list = (up.length ? `<h2>Próximas</h2>` + up.map(i => card(i,'agenda')).join('') : `<div class="empty">Nada marcado. Toque em <b>+ Anotar</b> para registrar uma prova ou trabalho.</div>`)
        + (past.length ? `<h2>Já passaram</h2>` + past.map(i => card(i,'agenda')).join('') : '');
    }
    box.innerHTML = calendar(evAll) + list;
  } else if (tab.kind === 'conteudo'){
    const names = [...SUBJ.map(s => s[0]), ...[...new Set(pool.map(i => i.subject))].filter(s => s && !findSubj(s)).sort()];
    box.innerHTML = names.map(s => {
      const li = pool.filter(i => i.subject === s).sort((a,b) => b.date.localeCompare(a.date));
      return `<details class="sec" ${li.length ? 'open' : ''}><summary><span class="ic">${icon(s)}</span>${esc(s)}<span class="n">${li.length} ${li.length === 1 ? 'conteúdo' : 'conteúdos'}</span>
        <button type="button" class="plus" data-add="${esc(s)}" aria-label="Adicionar em ${esc(s)}">+</button></summary>
        ${li.length ? `<div class="list">${li.map(i => card(i,'conteudo')).join('')}</div>` : `<div class="none">Nada anotado ainda.</div>`}</details>`;
    }).join('');
  } else {
    const li = pool.sort((a,b) => (b.ts||0) - (a.ts||0));
    box.innerHTML = li.length ? `<div class="notes">${li.map(i => card(i,'notas')).join('')}</div>` : `<div class="empty">Nenhuma anotação. Toque em <b>+ Anotar</b> para escrever a primeira.</div>`;
  }
}

/* ---------- interações ---------- */
$('#tabs').onclick = e => {
  const r = e.target.closest('[data-rmtab]'), t = e.target.closest('[data-tab]');
  if (r){
    const tab = tabs.find(x => x.id === r.dataset.rmtab);
    if (confirm(`Remover a aba "${tab.name}" e todas as anotações dela, para todo mundo?`)) store.removeTab(tab.id).then(() => toast('Aba removida')).catch(() => toast('Não deu para remover.'));
  } else if (t){ curId = t.dataset.tab; filter = ''; selDay = ''; render(); }
  else if (e.target.id === 'newtab'){ $('#tname').value = ''; $('#tdlg').showModal(); }
};
$('#chips').onclick = e => { const c = e.target.closest('.chip'); if (c){ filter = c.dataset.s; render(); } };
$('#list').onclick = e => {
  const cm = e.target.closest('[data-cal]'), dy = e.target.closest('[data-day]'), cl = e.target.closest('[data-clear]');
  if (cm){ calM = new Date(calM.getFullYear(), calM.getMonth() + Number(cm.dataset.cal), 1); render(); return; }
  if (dy){ selDay = selDay === dy.dataset.day ? '' : dy.dataset.day; render(); return; }
  if (cl){ selDay = ''; render(); return; }
  const p = e.target.closest('.plus'), d = e.target.closest('[data-del]'), m = e.target.closest('.main');
  if (p){ e.preventDefault(); openDlg(null, p.dataset.add); }
  else if (d){
    if (confirm('Excluir esta anotação para todo mundo?')) Promise.resolve(store.removeItem(d.dataset.del)).then(() => toast('Excluído')).catch(() => toast('Não deu para excluir.'));
  } else if (m) openDlg(items.find(i => i.id === m.dataset.id));
};
$('#add').onclick = () => openDlg(null, filter);
$('#cancel').onclick = () => $('#dlg').close();
$('#tcancel').onclick = () => $('#tdlg').close();

function openDlg(it, subject = ''){
  const tab = curTab(); if (!tab) return;
  editing = it; const k = tab.kind;
  $('#dlgTitle').textContent = it ? 'Editar' : 'Anotar';
  $('#del').hidden = !it;
  $('#typeBox').hidden = k !== 'agenda';
  $('#subjBox').hidden = k === 'notas'; $('#subject').required = k !== 'notas';
  $('#dateBox').hidden = k === 'notas'; $('#date').required = k !== 'notas';
  $('#titleLabel').textContent = k === 'conteudo' ? 'Assunto dado' : 'Título';
  $('#notesLabel').textContent = k === 'notas' ? 'Anotação' : 'Observações (opcional)';
  $('#notes').required = k === 'notas';
  document.querySelector(`[name=type][value=${it && it.type === 'trabalho' ? 'trabalho' : 'prova'}]`).checked = true;
  $('#subject').value = it ? it.subject : subject;
  $('#title').value = it ? it.title : '';
  $('#date').value = it ? it.date : (k === 'agenda' && selDay ? selDay : todayStr());
  $('#notes').value = it ? (it.notes || '') : '';
  $('#author').value = it ? (it.author || '') : (ls.get('triade-nome') || '');
  $('#dlg').showModal();
}
$('#form').onsubmit = async e => {
  e.preventDefault();
  const tab = curTab(), k = tab.kind, author = $('#author').value.trim();
  if (author) ls.set('triade-nome', author);
  const it = {
    id: editing?.id, tab: tab.id,
    type: k === 'agenda' ? document.querySelector('[name=type]:checked').value : k,
    subject: k === 'notas' ? '' : canon($('#subject').value.trim()),
    title: $('#title').value.trim(),
    date: k === 'notas' ? (editing?.date || todayStr()) : $('#date').value,
    notes: $('#notes').value.trim(), author, ts: editing?.ts || Date.now()
  };
  try { await store.saveItem(it); $('#dlg').close(); toast('Salvo!'); }
  catch { toast('Não deu para salvar. Tente de novo.'); }
};
$('#del').onclick = async () => {
  if (!confirm('Excluir esta anotação para todo mundo?')) return;
  try { await store.removeItem(editing.id); $('#dlg').close(); toast('Excluído'); }
  catch { toast('Não deu para excluir.'); }
};
$('#tform').onsubmit = async e => {
  e.preventDefault();
  const t = {name: $('#tname').value.trim(), kind: document.querySelector('[name=kind]:checked').value, order: Date.now()};
  try {
    const r = await store.saveTab(t);
    $('#tdlg').close(); toast('Aba criada!');
    if (r && r.id) curId = r.id; render();
  } catch { toast('Não deu para criar a aba.'); }
};

store.start((t, i) => { tabs = t; items = i; render(); });
</script>
</body>
</html>
